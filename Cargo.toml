[package]
name = "planista"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Publish files as short public permalinks"

[[bin]]
name = "planista"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bytes = "1"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
humantime = "2"
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "http1"] }
rusqlite = { version = "0.37", features = ["bundled"] }
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
